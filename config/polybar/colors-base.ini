;; colors-base.ini
;; Static palette shared by every theme. bg / fg / g / ac / red are
;; theme-controlled and get appended by ~/.config/bin/set-theme.sh into
;; the real colors.ini — don't add those four keys here.
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[color]

z = #0077B6
trans = #00000000
white = #FFFFFF
black = #000000

;; Material Colors
pink = #d81b60
purple = #8e24aa
deep-purple = #5e35b1
indigo = #3949ab
blue = #b1e3ff
light-blue = #039be5
cyan = #00acc1
teal = #00897b
green = #43a047
light-green = #7cb342
lime = #c0ca33
yellow = #FEC006
amber = #ffb300
orange = #F16E44
deep-orange = #f4511e
brown = #6d4c41
gray = #757575
blue-gray = #546e7a
